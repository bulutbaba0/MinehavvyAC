name: Build MineHavvyAC
on: [push]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: |
          mkdir -p stub/org/bukkit/block stub/org/bukkit/command stub/org/bukkit/entity stub/org/bukkit/event/block stub/org/bukkit/event/entity stub/org/bukkit/event/player stub/org/bukkit/plugin/java stub/org/bukkit/scheduler stub/org/bukkit/util build/classes
          printf "package org.bukkit;\nimport org.bukkit.command.CommandSender;\nimport org.bukkit.entity.Player;\nimport org.bukkit.plugin.PluginManager;\nimport org.bukkit.scheduler.BukkitScheduler;\nimport java.util.Collection;\nimport java.util.logging.Logger;\npublic class Bukkit { public static Server getServer(){return null;} public static Logger getLogger(){return null;} public static Collection<? extends Player> getOnlinePlayers(){return null;} public static BukkitScheduler getScheduler(){return null;} public static CommandSender getConsoleSender(){return null;} public static boolean dispatchCommand(CommandSender s,String c){return false;} public static int broadcastMessage(String m){return 0;} public static Player getPlayer(String n){return null;} }" > stub/org/bukkit/Bukkit.java
          printf "package org.bukkit;\nimport org.bukkit.plugin.PluginManager;\npublic interface Server { PluginManager getPluginManager(); }" > stub/org/bukkit/Server.java
          printf "package org.bukkit;\npublic enum GameMode { SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR }" > stub/org/bukkit/GameMode.java
          printf "package org.bukkit;\npublic enum Material { AIR }" > stub/org/bukkit/Material.java
          printf "package org.bukkit;\npublic enum Sound { ENTITY_LLAMA_SPIT }" > stub/org/bukkit/Sound.java
          printf "package org.bukkit;\nimport org.bukkit.entity.*;\npublic interface World { Entity spawnEntity(Location l, EntityType t); }" > stub/org/bukkit/World.java
          printf "package org.bukkit;\nimport org.bukkit.block.Block;\nimport org.bukkit.util.Vector;\npublic class Location implements Cloneable { public double getX(){return 0;} public double getY(){return 0;} public double getZ(){return 0;} public float getYaw(){return 0;} public float getPitch(){return 0;} public void setYaw(float y){} public void setPitch(float p){} public double distance(Location o){return 0;} public Location subtract(double x,double y,double z){return this;} public Location add(double x,double y,double z){return this;} public Block getBlock(){return null;} public Vector toVector(){return null;} public Vector getDirection(){return null;} public Location setDirection(Vector v){return this;} public Location clone(){return this;} }" > stub/org/bukkit/Location.java
          printf "package org.bukkit.block;\nimport org.bukkit.Material;\npublic interface Block { Material getType(); }" > stub/org/bukkit/block/Block.java
          printf "package org.bukkit.command;\npublic interface CommandSender { boolean hasPermission(String p); void sendMessage(String m); }" > stub/org/bukkit/command/CommandSender.java
          printf "package org.bukkit.command;\npublic abstract class Command {}" > stub/org/bukkit/command/Command.java
          printf "package org.bukkit.command;\npublic interface CommandExecutor { boolean onCommand(CommandSender s, Command c, String l, String[] a); }" > stub/org/bukkit/command/CommandExecutor.java
          printf "package org.bukkit.command;\npublic final class PluginCommand extends Command { public void setExecutor(CommandExecutor e){} }" > stub/org/bukkit/command/PluginCommand.java
          printf "package org.bukkit.entity;\npublic enum EntityType { LLAMA }" > stub/org/bukkit/entity/EntityType.java
          printf "package org.bukkit.entity;\npublic interface Projectile extends Entity {}" > stub/org/bukkit/entity/Projectile.java
          printf "package org.bukkit.entity;\npublic interface LlamaSpit extends Projectile {}" > stub/org/bukkit/entity/LlamaSpit.java
          printf "package org.bukkit.entity;\nimport org.bukkit.*;\nimport org.bukkit.command.CommandSender;\nimport org.bukkit.util.Vector;\npublic interface Entity extends CommandSender { Location getLocation(); World getWorld(); void setVelocity(Vector v); Vector getVelocity(); boolean teleport(Location l); void setInvulnerable(boolean f); void setFallDistance(float d); void remove(); }" > stub/org/bukkit/entity/Entity.java
          printf "package org.bukkit.entity;\nimport org.bukkit.Location;\nimport org.bukkit.util.Vector;\npublic interface LivingEntity extends Entity { Location getEyeLocation(); void setAI(boolean a); <T extends Projectile> T launchProjectile(Class<? extends T> p, Vector v); }" > stub/org/bukkit/entity/LivingEntity.java
          printf "package org.bukkit.entity;\npublic interface Mob extends LivingEntity { void setTarget(LivingEntity t); }" > stub/org/bukkit/entity/Mob.java
          printf "package org.bukkit.entity;\npublic interface Llama extends Mob {}" > stub/org/bukkit/entity/Llama.java
          printf "package org.bukkit.entity;\nimport org.bukkit.*;\nimport java.util.UUID;\npublic interface Player extends LivingEntity { String getName(); UUID getUniqueId(); GameMode getGameMode(); boolean isFlying(); boolean isGliding(); boolean isInsideVehicle(); boolean isOnline(); void setAllowFlight(boolean f); void setFlying(boolean v); void sendTitle(String t,String s,int i,int st,int o); void playSound(Location l,Sound s,float v,float p); }" > stub/org/bukkit/entity/Player.java
          printf "package org.bukkit.util;\npublic class Vector { public Vector(){} public Vector(double x,double y,double z){} public double getY(){return 0;} public Vector subtract(Vector v){return this;} public Vector normalize(){return this;} public Vector multiply(double m){return this;} public double angle(Vector o){return 0;} }" > stub/org/bukkit/util/Vector.java
          printf "package org.bukkit.event;\npublic abstract class Event {}" > stub/org/bukkit/event/Event.java
          printf "package org.bukkit.event;\npublic interface Cancellable { void setCancelled(boolean c); }" > stub/org/bukkit/event/Cancellable.java
          printf "package org.bukkit.event;\npublic interface Listener {}" > stub/org/bukkit/event/Listener.java
          printf "package org.bukkit.event;\nimport java.lang.annotation.*;\n@Retention(RetentionPolicy.RUNTIME)\n@Target(ElementType.METHOD)\npublic @interface EventHandler {}" > stub/org/bukkit/event/EventHandler.java
          printf "package org.bukkit.event.block;\npublic enum Action { LEFT_CLICK_AIR, LEFT_CLICK_BLOCK, RIGHT_CLICK_AIR, RIGHT_CLICK_BLOCK, PHYSICAL }" > stub/org/bukkit/event/block/Action.java
          printf "package org.bukkit.event.entity;\nimport org.bukkit.entity.Entity;\nimport org.bukkit.event.*;\npublic class EntityDamageEvent extends Event implements Cancellable { public Entity getEntity(){return null;} public void setCancelled(boolean c){} }" > stub/org/bukkit/event/entity/EntityDamageEvent.java
          printf "package org.bukkit.event.entity;\nimport org.bukkit.entity.Entity;\npublic class EntityDamageByEntityEvent extends EntityDamageEvent { public Entity getDamager(){return null;} }" > stub/org/bukkit/event/entity/EntityDamageByEntityEvent.java
          printf "package org.bukkit.event.player;\nimport org.bukkit.entity.Player;\nimport org.bukkit.event.Event;\nimport org.bukkit.event.block.Action;\npublic class PlayerInteractEvent extends Event { public Action getAction(){return null;} public Player getPlayer(){return null;} }" > stub/org/bukkit/event/player/PlayerInteractEvent.java
          printf "package org.bukkit.event.player;\nimport org.bukkit.Location;\nimport org.bukkit.entity.Player;\nimport org.bukkit.event.*;\npublic class PlayerMoveEvent extends Event implements Cancellable { public Player getPlayer(){return null;} public Location getFrom(){return null;} public Location getTo(){return null;} public void setTo(Location l){} public void setCancelled(boolean c){} }" > stub/org/bukkit/event/player/PlayerMoveEvent.java
          printf "package org.bukkit.event.player;\nimport org.bukkit.entity.Player;\nimport org.bukkit.event.*;\npublic class PlayerDropItemEvent extends Event implements Cancellable { public Player getPlayer(){return null;} public void setCancelled(boolean c){} }" > stub/org/bukkit/event/player/PlayerDropItemEvent.java
          printf "package org.bukkit.event.player;\nimport org.bukkit.entity.Player;\nimport org.bukkit.event.*;\npublic class PlayerCommandPreprocessEvent extends Event implements Cancellable { public Player getPlayer(){return null;} public void setCancelled(boolean c){} }" > stub/org/bukkit/event/player/PlayerCommandPreprocessEvent.java
          printf "package org.bukkit.plugin;\npublic interface Plugin {}" > stub/org/bukkit/plugin/Plugin.java
          printf "package org.bukkit.plugin;\nimport org.bukkit.event.Listener;\npublic interface PluginManager { void registerEvents(Listener l, Plugin p); }" > stub/org/bukkit/plugin/PluginManager.java
          printf "package org.bukkit.plugin.java;\nimport org.bukkit.Server;\nimport org.bukkit.command.PluginCommand;\nimport org.bukkit.plugin.Plugin;\nimport java.util.logging.Logger;\npublic abstract class JavaPlugin implements Plugin { public void onEnable(){} public Server getServer(){return null;} public Logger getLogger(){return null;} public PluginCommand getCommand(String n){return null;} }" > stub/org/bukkit/plugin/java/JavaPlugin.java
          printf "package org.bukkit.scheduler;\nimport org.bukkit.plugin.Plugin;\nimport org.bukkit.scheduler.BukkitTask;\npublic interface BukkitScheduler { void runTask(Plugin p, Runnable r); BukkitTask runTaskLater(Plugin p, Runnable r, long d); }" > stub/org/bukkit/scheduler/BukkitScheduler.java
